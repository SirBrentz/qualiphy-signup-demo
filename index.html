<style>
  :root { color-scheme: light dark; --bg: #f5f5f5; --field: #fff; --line: #d4d4d4; --ink: #171717; --btn: #262626; --btn-ink: #fff; --bad: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --field: #1c1c1c; --line: #3a3a3a; --ink: #eee; --btn: #e5e5e5; --btn-ink: #111; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); display: grid; place-items: center; padding: 16px; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  form { display: flex; gap: 8px; width: min(320px, 100%); visibility: hidden; }
  html.ready form { visibility: visible; }
  input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink); font-size: 16px; }
  input:focus { outline: none; border-color: var(--ink); }
  input[aria-invalid="true"] { border-color: var(--bad); animation: shake .3s; }
  button { flex: none; width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: progress; }
  button svg { width: 20px; height: 20px; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>

  const KEY = 'qualiphy-demo-gate-v1';
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const text = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
  const norm = (s) => String(s).replace(/[\s-]+/g, '').toUpperCase();
  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pw)), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(P.salt), iterations: P.iter }, base, 256);

  async function unlock(bits) {
